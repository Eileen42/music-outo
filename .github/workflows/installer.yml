name: 인스톨러 exe 빌드 & Release 업로드

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '수동 빌드용 버전 (예: 1.0.0)'
        required: false
        default: '0.0.0-manual'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 결정
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "버전: $VERSION"

      - name: Python 3.13 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Python 의존성 + PyInstaller 설치
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: 프론트엔드 빌드
        shell: powershell
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: ffmpeg 다운로드 (EXE 동봉용 — vendor/ffmpeg 는 git 제외라 CI 에서 받음)
        shell: powershell
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force -Path vendor\ffmpeg | Out-Null
          Copy-Item (Join-Path $bin 'ffmpeg.exe')  vendor\ffmpeg\ -Force
          Copy-Item (Join-Path $bin 'ffprobe.exe') vendor\ffmpeg\ -Force
          Write-Host "ffmpeg 준비 완료: $(Get-ChildItem vendor\ffmpeg | Select-Object -ExpandProperty Name)"

      - name: PyInstaller 로 단일 실행 환경 빌드
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean build_exe.spec
          Get-ChildItem -Path dist\music-outo | Select-Object Name | Out-String

      - name: Inno Setup 설치
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: 인스톨러 컴파일 (단일 EXE 폴더 → setup.exe)
        shell: powershell
        env:
          APP_VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$env:APP_VERSION `
            installer\music-outo.iss
          Get-ChildItem -Path installer\Output -Recurse

      - name: 빌드 산출물 업로드 (GitHub Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: music-outo-setup-${{ steps.ver.outputs.VERSION }}
          path: installer/Output/music-outo-setup.exe

      - name: GitHub Release 생성 + exe 첨부 (태그 push 시만)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/music-outo-setup.exe
          name: Music Outo ${{ steps.ver.outputs.VERSION }}
          body: |
            ## Music Outo ${{ steps.ver.outputs.VERSION }}

            ### 설치 방법
            1. 아래 `music-outo-setup.exe` 를 다운로드
            2. 더블클릭해서 실행
            3. 설치 마법사 안내에 따라 진행
            4. 완료 후 바탕화면의 "Music Outo" 아이콘 더블클릭

            ※ Docker / Python / Node 등 외부 프로그램 설치 불필요.
            ※ 첫 실행 시 Gemini API 키만 입력하면 바로 사용 가능합니다.
          draft: false
          prerelease: false
